; Root aggregator: makes the repo root a valid PlatformIO project.
; Mirrors esp/platformio.ini and mega/platformio.ini — keep in sync when
; changing boards, flags, or libs. Subfolder configs still work standalone.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
src_dir = esp/src
build_flags =
    -I shared
    -D BOARD_ESP32
    -D SIM_MODE
monitor_speed = 115200c
lib_deps =
    links2004/WebSockets@^2.4.1
    bblanchon/ArduinoJson@^7.0.0

[env:megaatmega2560]
platform = atmelavr
board = megaatmega2560
framework = arduino
src_dir = mega/src
build_flags =
    -I shared
    -D BOARD_MEGA
    -D BENCH_MODE
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo@^1.2.1

[env:mega_sim]
platform = atmelavr
board = megaatmega2560
framework = arduino
src_dir = mega/src
build_flags =
    -I shared
    -D BOARD_MEGA
    -D BENCH_MODE
    -D SIM_MODE
monitor_speed = 115200
lib_deps =
    arduino-libraries/Servo@^1.2.1
